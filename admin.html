<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="HireNest demo administration dashboard."><title>Admin Dashboard | HireNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main><section class="page-hero admin-hero"><div class="container"><span class="eyebrow">Workspace / Administration</span><h1>Manage your <span>opportunities.</span></h1><p>A demo dashboard for managing HireNest listings and applications. Local Storage is not secure authentication.</p></div></section><section class="section admin-section"><div class="container"><div class="dashboard-stats" id="dashboard-stats"></div><div class="admin-columns"><section class="admin-card"><div class="card-heading"><div><span class="eyebrow">Job management</span><h2 id="job-form-title">Add a new job</h2></div><button id="cancel-edit" class="button-reset hidden">Cancel edit</button></div><form id="job-form" class="admin-form"><input type="hidden" name="id"><div class="form-grid"><label>Job title<input name="title" required></label><label>Company name<input name="company" required></label><label>Location<input name="location" required></label><label>Category<input name="category" required placeholder="Technology"></label><label>Employment type<select name="type"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></label><label>Experience level<select name="experienceLevel"><option>Entry level</option><option>Mid level</option><option>Senior level</option><option>Lead</option></select></label><label>Salary<input name="salary" required placeholder="$90,000 – $120,000"></label><label>Application deadline<input name="deadline" type="date"></label></div><label>Job description<textarea name="description" rows="4" required></textarea></label><label>Responsibilities<textarea name="responsibilities" rows="3" required placeholder="One responsibility per line"></textarea></label><label>Requirements<textarea name="requirements" rows="3" required placeholder="One requirement per line"></textarea></label><label>Skills<input name="skills" required placeholder="JavaScript, APIs, testing"></label><button class="btn btn-primary" type="submit" id="job-submit">Add job <span>→</span></button></form></section><section class="admin-card"><div class="card-heading"><div><span class="eyebrow">Your listings</span><h2>All jobs</h2></div><input id="admin-search" class="compact-input" placeholder="Search jobs"></div><div id="admin-jobs" class="admin-list"></div></section></div><section class="admin-card applications-card"><div class="card-heading"><div><span class="eyebrow">Candidate pipeline</span><h2>Applications received</h2></div></div><div id="admin-applications" class="application-list"></div></section></div></section></main><div id="site-footer"></div><script src="js/data.js"></script><script src="js/main.js"></script><script src="js/admin.js"></script></body></html>
