<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Apply for a job on HireNest."><title>Apply | HireNest</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="site-header"></div><main><section class="section form-section"><div class="container narrow-container"><a class="back-link" href="jobs.html">← Back to jobs</a><div id="application-heading" class="form-heading"></div><form id="application-form" class="application-form" novalidate><div class="form-grid"><label>Full name<input name="name" required autocomplete="name" placeholder="Jane Smith"><span class="field-error" data-error="name"></span></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="jane@example.com"><span class="field-error" data-error="email"></span></label><label>Phone number<input name="phone" required autocomplete="tel" placeholder="+1 555 123 4567"><span class="field-error" data-error="phone"></span></label><label>Current location<input name="location" required placeholder="City, Country"><span class="field-error" data-error="location"></span></label><label>Educational qualification<input name="qualification" required placeholder="BSc Computer Science"><span class="field-error" data-error="qualification"></span></label><label>Years of experience<input name="experience" type="number" min="0" max="60" step="0.5" required placeholder="3"><span class="field-error" data-error="experience"></span></label></div><label>Skills<input name="skills" required placeholder="JavaScript, research, communication"><span class="field-error" data-error="skills"></span></label><label>Resume URL <small>(optional)</small><input name="resume" type="url" placeholder="https://linkedin.com/in/your-profile"><span class="field-error" data-error="resume"></span></label><label>Cover letter<textarea name="coverLetter" rows="7" required placeholder="Tell the hiring team why you are a great fit..."></textarea><span class="field-error" data-error="coverLetter"></span></label><button class="btn btn-primary btn-wide" type="submit">Submit application <span>→</span></button><div id="application-message" role="status"></div></form></div></section></main><div id="site-footer"></div><script src="js/data.js"></script><script src="js/main.js"></script><script src="js/apply.js"></script></body></html>
